            }
            .profile span:nth-of-type(2){

                padding: 10px;
                margin-left: 10px;
                border: none;
                border-radius: 100px;
                background-color: #7d7d7d;
                cursor: pointer;
            }

                justify-content: space-around;
                gap: 10px;

                padding: 15px;
                height: 55px;
                background-color: #fb7299;
                border: none;
                border-radius: 100px;
                margin: auto;
            }

                width: 65%;
                border: none;
                border-radius: 100px 0 0 100px;
                text-indent: 1em
            }
            .search input:nth-of-type(2) {
                background-color: #00000000;
                color: white;
            }
            /* Body */
            section {
                height: 80vh;
                overflow: scroll;
                padding: 50px 0 0 0;
            }
            .videolist {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 50px;
            }
            .video {
                width: 400px;
                height: 450px;
                background-color: white;
                border: none;
                border-radius: 40px;
                box-shadow: 0 0 50px 10px #a7a7a7;
                cursor: pointer;
            }
            .video div:nth-of-type(1) {
                display: flex;
                background-color: #fb729935;
                justify-content: center;
                align-items: center;
                border: none;
                border-radius: 40px 40px 0 0;
                height: 60%;
            }
            .video div:nth-of-type(2) {

                background-color: #fb7299a5;
                color: white;
                padding: 0 0 0 1em;
            }

                color: #676767;
                background-color: #fb729995;
                padding: 0 0 0 1em;
                border-radius: 0 0 40px 40px;
            }
