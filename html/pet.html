<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>我的宠物</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }
            body {
                height: 90vh;
                background: linear-gradient(-150deg,#2f24ff,#7dd6ed,#2ec8ac,#0d94ee) no-repeat;
            }
            div {
                overflow-wrap: break-word;
            }

            .flex-between {
                display: flex;
                justify-content: space-between;
            }
            main {
                margin: 20px 0 0 0;
                display: flex;
                height: 60vh;
                justify-content: space-around;
            }
            .button-left {
                display: flex;
                flex-direction: column;
                width: 20%;
                justify-content: space-around;
            }
            .button-left > input {
                width: 70%;
                min-height: 80px;
                background-color: #00000000;
                border: none;
                border-radius: 0 100px 100px 100px;
                padding: 0.5rem;
                font-size: 1.4rem;
                color: #237f29;
                backdrop-filter: blur(4px);
                box-shadow: inset -6px -3px 15px 5px #ffffff63;
                transition: width 0.6s;
            }
            .button-left > input:hover {
                width: 100%;
                cursor: pointer;
                transition: width 0.6s;
                color: #00ff12;
            }
            .protagonist {
                width: 60%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .prota {
                width: 100%;
                height: 100%;
                background: url("../image/pet_icon.png") no-repeat center;
                background-size: contain;
                cursor: pointer;
            }
            #message {
                width: 25%;
                min-height: 10%;
                padding: 20px;
                border-radius: 20px 20px 0 20px;
                text-indent: 2rem;
                backdrop-filter: blur(4px);
                box-shadow: inset -6px -3px 15px 5px #ffffff83;
            }
            footer {
                display: flex;
                flex-direction: column-reverse;
                position: fixed;
                bottom: 0;
                width: 100%;
                height: 16vh;
                background: linear-gradient(90deg, #E3772B,#CBCB41,#E3772B,#CBCB41) no-repeat;
            }
            .foot {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                overflow: scroll;
                scrollbar-width: none;
                -ms-overflow-style: none;
                justify-content: space-around;
                color: white;
                background-color: #2b2b2b;
                height: 90%;
                width: 100%;
            }
            .foot > div {
                border-radius: 100px;
                padding: 15px;
                box-shadow: 0 0 30px 5px black;
                border: 1px solid #525252;
            }
            .foot span {
                border-radius: 100px;
                padding: 10px 40px;
                box-shadow: inset 0 0 20px 1px black;
                margin: 0 10px;
                border: 1px solid #525252;
            }
            .foot > div:hover {
                cursor: default;
            }
            .window {
                display: none;
                position: fixed;
                top: 0;
                width: 100%;
                height: 100vh;
                background-color: #000000aa;
                z-index: 100;
            }
            .window-main {
                width: 800px;
                height: 150px;
                margin: 25vh auto;
                text-align: center;
            }
            .window-main p:nth-of-type(1) {
                background-color: blue;
                color: white;
                height: 15%;
            }
            .window-main p:nth-of-type(2) {
                height: 85%;
                padding: 20px 0 0 0;
                background-color: white;
            }
            .winbutton-confirm {
                margin-top: 5%;
                padding: 5px 10px;
                background-color: #e27d00;
                border: none;
                box-shadow: -3px 2px 0 1px #a85c00;
                color: white;
                cursor: pointer;
            }
            .payfood_background {
                position: fixed;
                top: 0;
                height: 100vh;
                width: 100%;
                background-color: #00000067;
                display: none;
                justify-content: center;
                z-index: 100;
            }
            .payfood_window {
                margin-top: 20vh;
                width: 45%;
                height: 40vh;
            }
            .window_title {
                background-color: #76ba51;
                color: white;
                text-align: center;
                border-radius: 30px 30px 0 0;
                height: 10%;
                padding: 18px 0 0 0;
            }
            .window_main {
                padding: 20px;
                background-color: #d9d9a5;
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 10px;
                border-radius: 0 0 20px 20px;
                height: 85%;
                overflow: scroll;
                scrollbar-width: none;
            }
            .paycard {
                width: 25%;
                height: 220px;
                background-color: white;
                border: 1px solid #b2b2b2;
                border-radius: 30px;
                padding: 10px;
                cursor: pointer;
            }
            .cardup {
                height: 75%;
                background-color: #d7d4d4;
                border-radius: 30px;
                font-size: 1.8rem;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .carddown {
                margin-top: 10px;
                height: 25%;
                border-top: 1px solid #979797;
                color: #979797;
            }
            .carddown span {
                color: red;
                margin: 0 0.6rem 0 0;
            }
            .carddown span > del {
                color: #979797;
                margin: 0 0 0 0.3rem;
            }

            /* Phone */
            @media (width <= 500px) {
                main {
                    flex-direction: column-reverse;
                    gap: 40px;
                }
                .button-left, .button-left input {
                    width: 100%;
                    gap: 30px;
                }
                .prota {
                    min-height: 30%;
                }
                .protagonist {
                    width: 100%;
                }
                footer {
                    height: 10vh;
                }
                .foot {
                    padding: 10px 0;
                    gap: 20px;
                }
                .window-main {
                    width: 200px;
                }
                .payfood_window {
                    width: 90%;
                }
                .paycard {
                    width: 40%;
                }
            }
            /* Pad */
            @media (height <= 600px) {
                .button-left input {
                    width: 100%;
                    margin: 0 0 20px 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="window">
            <div class="window-main">
                <p>温馨提示</p>
                <p>
                    暂未开发，敬请期待 O.O<br/>
                    <input type="button" class="winbutton-confirm" value="确定" onclick="confirms()"/>
                </p>
            </div>
        </div>
        <div class="payfood_background">
            <div class="payfood_window">
                <div class="window_title" onclick="payfood(1)">并夕夕·食物区 (单击导航栏关闭窗口)</div>
                <div class="window_main">
                    <div class="paycard" onclick="payfoods(6)">
                        <div class="cardup"><span>🥫</span></div>
                        <div class="carddown"><span>￥6</span>番茄肉罐头</div>
                    </div>
                    <div class="paycard" onclick="payfoods(7)">
                        <div class="cardup"><span>🍌</span></div>
                        <div class="carddown"><span>￥7<del>￥8</del></span>香蕉</div>
                    </div>
                    <div class="paycard" onclick="payfoods(16)">
                        <div class="cardup"><span>🍛</span></div>
                        <div class="carddown"><span>￥16<del>￥29.9</del></span>番茄炖香蕉</div>
                    </div>
                    <div class="paycard" onclick="payfoods(8)">
                        <div class="cardup"><span>🥤</span></div>
                        <div class="carddown"><span>￥8<del>￥9.9</del></span>鱼子酱可乐</div>
                    </div>
                </div>
            </div>
        </div>
        <main>
            <div class="button-left">
                <input type="button" value="投喂" onclick="towei()"/>
                <input type="button" value="对话" onclick="chat()"/>
                <input type="button" value="种菜" onclick="grow()"/>
                <input type="button" value="购买食物" onclick="payfood()"/>
            </div>
            <div class="protagonist">
                <div class="prota" onclick="touchme()">
                    <div id="message">你好~ 我是你的电子杂鱼</div>
                </div>
            </div>
        </main>
        <footer>
            <section class="foot">
                <div>食物饱和度<span id="hunger">?</span></div>
                <div>亲密度<span id="love">?</span></div>
                <div>金币<span id="money">?</span></div>
                <div>食物数量<span id="food">?</span></div>
            </section>
        </footer>
        <script>
            let hg = 101;
            let love = 71;
            let money = 100;
            let food = 10;
            const npcchat_no1 = ["杂鱼～醒啦？(￣▽￣*)", "又丑又笨呢(｀へ´)", "慢死了笨蛋！(╯‵□′)╯", "就这？弱鸡～(¬_¬)", "哭吧哭吧～(￣▽￣)ノ", "活该你单身(-_-)", "脑子进水了？(－‸ლ)", "三秒就忘事？(￣.￣)", "吵死了闭嘴！(｀ε´)", "废物早安呀(๑•́ ₃ •̀๑)"];
            const npcchat_no2 = ["才、才不是等你呢！(｀ω´)", "笨狗！只准看我啦(〃∀〃)", "手汗脏死了…牵吧(￣▽￣)ゞ", "夸你一句别飘啊(๑´ㅂ`๑)", "盯～想被我踩？(－‸ლ)", "巧克力…顺便做的！(｡•́︿•̀｡)", "哭包，肩膀借你(￣︶￣)♥", "再摸头就咬你哦(｀ε´)ノ", "哼！只对你毒舌啦(⁄ ⁄•⁄ω⁄•⁄ ⁄)", "约会？我勉为其难(╯▽╰)"];
            const npcchat_no3 = ["啊~ 我警告你！别乱来啊！OAO","这里不行！>_<","我不是好惹的！o(≧口≦)o","快把手拿开！","臭杂鱼~ 手往哪摸呢！","再摸就要变成里番啦！ヽ（≧□≦）ノ"];
            const npcchat_no4 = ["哇！你怎么知道我喜欢这个","这个东西很好吃欸","隔~","我还要！"];
            // css
            let idHunger = document.getElementById("hunger");
            let idLove = document.getElementById("love");
            let idMoney = document.getElementById("money");
            let idFood = document.getElementById("food");
            let idMessage = document.getElementById("message");
            inners();
            hunger_love_sleep();

            function hunger_love_sleep() {  // 30s Hunger
                if (hg <= 0) {
                    hg = 0;
                    idMessage.innerHTML = "啊~ 主人，企鹅的肚肚打雷了qwq";
                    love -= 2;
                }
                else {
                    hg -= 1;
                    love -= 1;
                }
                loveislow();
                inners();
                setTimeout(hunger_love_sleep, 30000);
            }

            function dontzero() {
                if (love < 0) {
                    love = 0;
                }
                if (hg < 0) {
                    hg = 0;
                }
                if (money < 0) {
                    money = 0;
                }
                if (food < 0) {
                    food = 0;
                }
                return;
            }

            function loveislow() {
                dontzero();
                if (love <= 0) {
                    idMessage.innerHTML = "滚啊！!别碰我！";
                }
                else if (love <= 20) {
                    idMessage.innerHTML = "哼！凑杂鱼，你好讨厌！";
                    love -= 1;
                }
                return;
            }

            function inners() {
                idFood.innerHTML = food;
                idHunger.innerHTML = hg;
                idLove.innerHTML = love;
                idMoney.innerHTML = money;
                return;
            }

            function grow() {
                document.getElementsByClassName("window")[0].style.display = "block";
            }
            function confirms() {
                document.getElementsByClassName("window")[0].style.display = "none";
            }

            function touchme() {
                dontzero();
                idMessage.innerHTML = npcchat_no3[Math.floor(Math.random()*npcchat_no3.length)];
                if (hg <= 0 && love >= 0) {
                    idMessage.innerHTML = "哼！凑杂鱼快喂我吃的！";
                    love -= 1;
                }
                else if (typeof hg != "number") {
                    idMessage.innerHTML = "你开了？！";
                }
                else if (love != 0) {
                    love -= Math.floor(Math.random()*4);
                    money += Math.floor(Math.random()*10);
                    hg -= 2;
                }
                loveislow();
                inners();
            }

            function chat() {
                dontzero();
                if (hg <= 0) {
                    idMessage.innerHTML = "啊~ 好饿！凑杂鱼快喂我吃的！";
                    love -= 1;
                }
                else if (typeof hg != "number") {
                    idMessage.innerHTML = "你开了？！";
                }
                else {
                    let bools = Math.floor(Math.random()*2);
                    if (bools == 0) {
                        idMessage.innerHTML = npcchat_no2[Math.floor(Math.random()*npcchat_no2.length)];
                    }
                    else if (bools == 1) {
                        idMessage.innerHTML = npcchat_no1[Math.floor(Math.random()*npcchat_no1.length)];
                    }
                    love += 2;
                    hg -= 1;
                }
                loveislow();
                inners();
            }

            function towei() {
                if (food <= 0) {
                    idMessage.innerHTML = "哼！什么东西都没有qwq";
                }
                else if (hg >= 100) {
                    idMessage.innerHTML = "真的吃不下了 :("
                }
                else if (typeof food != "number") {
                    idMessage.innerHTML = "你开了？！";
                }
                else {
                    hg += 1;
                    food -= 1;
                    love += 2;
                    idMessage.innerHTML = npcchat_no4[Math.floor(Math.random()*npcchat_no4.length)];
                }
                inners();
            }

            function payfood(payfood_bool) {
                dontzero();
                if (payfood_bool == 1) {
                    document.getElementsByClassName("payfood_background")[0].style.display = "none";
                }
                else if (payfood_bool != 1) {
                    document.getElementsByClassName("payfood_background")[0].style.display = "flex";
                }
            }

            function payfoods(foodHowmoney) {
                dontzero();
                if (money <= 0) {
                    document.getElementsByClassName("payfood_background")[0].style.display = "none";
                    idMessage.innerHTML = "凑杂鱼，这就没钱了？赏你6元";
                    money += 6;
                }
                else if (typeof money != "number") {
                    document.getElementsByClassName("payfood_background")[0].style.display = "none";
                    idMessage.innerHTML = "你开了？！";
                }
                else {
                    document.getElementsByClassName("payfood_background")[0].style.display = "none";
                    money -= foodHowmoney;
                    food += 1;
                    if (love >= 20) {
                        idMessage.innerHTML = "看你刚刚打开了网购平台，你又买啥好吃的啦~ 快炫我嘴里q(≧▽≦q)";
                    }
                    else if (love < 30 && love != 0) {
                        idMessage.innerHTML = "你干嘛！我就看看而已，才....才不是想吃呢！";

                    }
                    else if (love == 0) {
                        idMessage.innerHTML = "哼！别以为买几个小鱼干就想收买我 >:(";
                    }
                }
                inners();
            }
        </script>
    </body>
</html>
